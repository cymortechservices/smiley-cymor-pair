name: Extract pair zip

on:
  push:
    paths:
      - "SMILEY-CYMOR-MD-pair.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the zip exists
        run: |
          test -f SMILEY-CYMOR-MD-pair.zip || { echo "SMILEY-CYMOR-MD-pair.zip not found in repo root"; exit 1; }

      - name: Extract and flatten
        run: |
          rm -rf /tmp/pair && mkdir /tmp/pair
          unzip -q SMILEY-CYMOR-MD-pair.zip -d /tmp/pair
          # contents of smiley-cymor-pair/ go to the repo root
          cp -a /tmp/pair/smiley-cymor-pair/. .
          rm -f SMILEY-CYMOR-MD-pair.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Extract SMILEY CYMOR MD pair site [skip ci]"
          git push
