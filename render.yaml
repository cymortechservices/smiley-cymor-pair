services:
  - type: web
    name: smiley-cymor-pair
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: BOT_REPO
        sync: false        # e.g. https://github.com/yourname/smiley-cymor-md
      - key: NODE_VERSION
        value: "22"
